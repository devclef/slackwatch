name: Build and Push Slackwatch Image

on:
  push:
    branches:
      - main

    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'frontend/**'
      - '.github/workflows/slackwatch.yml'

concurrency:
  group: "slackwatch"
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ghcr.io/devclef/slackwatch:preview,ghcr.io/devclef/slackwatch:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/devclef/slackwatch:pr-build-cache
          cache-to: type=registry,ref=ghcr.io/devclef/slackwatch:pr-build-cache,mode=max
